baseURL = "https://x7c0de0x.tech/"
languageCode = "en-us"
title = "x7c0de0x"
theme = "PaperMod"
paginate = 10

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# ───────────────────────── Menu ─────────────────────────
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "writeups"
    name = "Writeups"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 3

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4

  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 5

  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 6

# ───────────────────────── Params ─────────────────────────
[params]
  env = "production"
  title = "x7c0de0x"
  description = "Security Researcher · Bug Bounty Hunter · Breaking things to make them safer"
  keywords = ["cybersecurity", "bug bounty", "writeups", "CVE", "penetration testing", "security research"]
  author = "x7c0de0x"

  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # Custom CSS: assets/css/extended/dracula.css (Phantom Dark Premium)

  [params.assets]
    # favicon = "<link / abs url>"
    # disableHLJS = true # to disable highlight.js

  [params.profileMode]
    enabled = false

  [params.homeInfoParams]
    Title = "x7c0de0x_"
    Content = "Security Researcher · Bug Bounty Hunter · Penetration Tester"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Mahm0udMunir0"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/x7c0de0x"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your@email.com"

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# ───────────────────────── Markup ─────────────────────────
[markup]
  [markup.highlight]
    style = "native"
    noClasses = true
    lineNos = false
    anchorLineNos = false
    guessSyntax = true
